[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nullmodel"
version = "0.1.0"
description = "Training-free foundation-model null baselines and data-hygiene checks for tabular and forecasting claims"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3"]

[project.optional-dependencies]
tabular = ["tabpfn>=6"]
forecast = ["chronos-forecasting>=2.0", "statsforecast>=1.7"]
classical = ["catboost>=1.2"]
all = ["tabpfn>=6", "chronos-forecasting>=2.0", "statsforecast>=1.7", "catboost>=1.2"]

[tool.setuptools.packages.find]
include = ["nullmodel*"]
